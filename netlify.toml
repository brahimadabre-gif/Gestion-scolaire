# Téléchargements Android : l'APK doit arriver tel quel.
# Sans ces en-têtes, Netlify envoie l'APK compressé (Brotli) aux navigateurs qui
# l'acceptent ; certains gestionnaires de téléchargement Android l'enregistrent
# sans le décompresser et l'installation échoue (« problème lors de l'analyse du
# package »). « no-transform » interdit toute compression ou modification.
[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-transform"
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
